<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert marked text into Unicode display styles.">
  <title>Unicode Text Formatter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="hero">
      <p class="eyebrow">Unicode tools</p>
      <h1>Text Formatter</h1>
      <p class="intro">Wrap the text you want to transform with a delimiter. Your formatted text updates as you type.</p>
    </header>

    <section class="controls" aria-label="Formatting options">
      <label for="fontStyle">Font style
        <select id="fontStyle"></select>
      </label>
      <label for="delimiter">Delimiter
        <input id="delimiter" type="text" value="**" spellcheck="false" aria-describedby="delimiter-help">
      </label>
      <p id="delimiter-help" class="hint">Example: <code>Make **this** bold</code></p>
    </section>

    <section class="editor-grid" aria-label="Text editor">
      <div class="panel">
        <div class="panel-heading"><label for="inputText">Input</label><span>Ctrl+B wraps a selection</span></div>
        <textarea id="inputText" placeholder="Type or paste text here…" spellcheck="true"></textarea>
      </div>
      <div class="panel output-panel">
        <div class="panel-heading"><label for="outputText">Formatted output</label><button id="copyButton" type="button">Copy</button></div>
        <textarea id="outputText" readonly aria-label="Formatted output" placeholder="Your formatted text will appear here"></textarea>
      </div>
    </section>
  </main>
  <div id="toast" role="status" aria-live="polite">Copied to clipboard</div>

  <script src="jquery-3.7.1.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
