<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Convert marked text into Unicode display styles.">
  <title>Unicode Text Formatter</title>

  <!-- PWA & Mobile Meta Tags -->
  <meta name="theme-color" content="#6366f1">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Unicode Text">

  <!-- Web App Manifest -->
  <link rel="manifest" href="manifest.webmanifest">

  <!-- Icons & Favicon -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono&family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <main class="app-shell">
    <header class="hero">
      <div class="hero-badges">
        <p class="eyebrow">Unicode tools</p>
        <button id="installButton" class="install-btn" type="button" hidden aria-label="Install Unicode Text Formatter as app">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span>Install App</span>
        </button>
      </div>
      <h1>Text Formatter</h1>
      <p class="intro">
        Wrap the text you want to transform with a delimiter. Your formatted text updates as you type.
      </p>
    </header>

    <section class="editor-grid" aria-label="Text editor">
      <div class="panel glass-panel">
        <div class="panel-heading">
          <label for="inputText">Input</label>
          <div class="input-actions">
            <input id="delimiter" class="header-input" type="text" value="**" spellcheck="false" aria-label="Delimiter"
              title="Text Delimiter (e.g. **text**)">
            <button id="boldButton" type="button" aria-label="Wrap selected text in bold markers">
              <strong>B</strong>
            </button>
          </div>
        </div>
        <textarea id="inputText" placeholder="Type or paste text here (e.g. **hello**)…" spellcheck="true"></textarea>
        <span class="char-count" id="inputCharCount">0 chars</span>
      </div>
      <div class="panel glass-panel output-panel">
        <div class="panel-heading">
          <label for="outputText">Output</label>
          <div class="input-actions">
            <select id="fontStyle" class="header-select" aria-label="Font style"></select>
            <button id="copyButton" type="button">Copy</button>
          </div>
        </div>
        <textarea id="outputText" readonly aria-label="Formatted output"
          placeholder="Your formatted text will appear here"></textarea>
        <span class="char-count" id="outputCharCount">0 chars</span>
      </div>
    </section>
  </main>

  <div id="toast" role="status" aria-live="polite">Copied to clipboard</div>

  <script src="jquery-3.7.1.min.js"></script>
  <script>window.jQuery || document.write('<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"><\/script>')</script>
  <script src="app.js"></script>
</body>

</html>
